name: UI Automation Tests & Allure Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền để Actions có thể push code report lên nhánh gh-pages

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Run Pytest
        continue-on-error: true
        run: pytest --alluredir=reports

      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        # Lệnh này lấy data từ thư mục 'reports' và build ra web HTML tại thư mục 'allure-report'
        run: allure generate reports -o allure-report --clean

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
