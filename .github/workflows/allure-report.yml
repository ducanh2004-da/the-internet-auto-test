name: UI Automation Tests & Allure Report

on:
  push:
    branches:
      - main # Workflow sẽ chạy khi có code mới đẩy lên nhánh main
  workflow_dispatch: # Cho phép bạn trigger chạy bằng tay trên giao diện GitHub

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền để Actions có thể push code report lên nhánh gh-pages

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # Điền version Python bạn đang sử dụng

      - name: Install Chrome & ChromeDriver
        # Cài đặt trình duyệt ẩn (headless) để chạy Selenium trên server của GitHub
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        continue-on-error: true
        # Chạy test và lưu kết quả thô vào thư mục reports giống với cấu trúc hiện tại của bạn
        run: pytest --alluredir=reports

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: reports # Đọc các file JSON/TXT thô từ thư mục reports[cite: 2]
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20 # Giữ lại lịch sử của 20 lần chạy gần nhất

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
